# SPDX-License-Identifier: GPL-3.0-or-later
#
# Every pull request runs: configure -> build Debug -> build Release ->
# unit tests -> integration tests -> static analysis (PLAN.md section 33).
#
# No CAN hardware is involved: the virtual backend covers the integration
# level, which is exactly why it was built first.

name: CI

# Both names. The default branch here is master; every example of this file on
# the internet says main, and a workflow that lists the wrong branch does not
# fail - it simply never runs, which is the same shape of bug as a package that
# silently omits a plugin.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  QT_VERSION: 6.11.2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 (${{ matrix.build_type }})
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtserialbus
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: lukka/get-cmake@latest

      # KDDockWidgets and Catch2 are fetched at configure time; caching the
      # FetchContent tree turns a ~4 minute clone+build into seconds.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('cmake/TorqueBusDependencies.cmake') }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DTORQUEBUS_BUILD_TESTS=ON
          -DTORQUEBUS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        working-directory: build
        run: ctest --output-on-failure --label-exclude integration --label-exclude hardware

      - name: Integration tests
        working-directory: build
        run: ctest --output-on-failure --label-regex integration

      # --component torquebus, not a plain install: KDDockWidgets and QtNodes
      # come in through FetchContent, so their install rules are ours to run,
      # and a plain install writes their headers and CMake config into what is
      # supposed to be an application.
      - name: Package
        if: matrix.build_type == 'Release'
        run: |
          cmake --install build --prefix dist --component torquebus
          windeployqt --release --no-translations --no-system-d3d-compiler dist/TorqueBusStudio.exe

      # The artifact is what people download, so it is what gets checked. The
      # build being green says nothing about whether the plugins were copied.
      - name: Check the package
        if: matrix.build_type == 'Release'
        run: pwsh tools/check-package.ps1 -Path dist

      - name: Upload build
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: TorqueBus-Studio-win64
          path: dist/

  # Named for what it does. It used to be "Formatting and static analysis", and
  # the static analysis half was a step that ran `echo` behind
  # continue-on-error - a check that could not fail because it checked nothing.
  # clang-tidy needs a compilation database, and producing one means configuring
  # the project, which needs Qt and MSVC. There is a real way to do it (the core
  # is Qt-free by rule 3, so it could be analysed alone) and that is worth doing
  # properly rather than pretending it is already done.
  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang tooling
        run: sudo apt-get update && sudo apt-get install -y clang-format-17

      # third_party is excluded because it is not ours to format: the glob used
      # to include 27 vendored Lua headers, which are C written in someone
      # else's style and can never match a config of ours.
      #
      # Advisory, and honestly labelled as such. The codebase is hand-formatted
      # - line breaks chosen for meaning, in places where clang-format would
      # join the line because it fits - so this reports what it would change
      # instead of refusing the merge. Turning it into a gate means reformatting
      # 246 of 263 files first, which is a decision about the whole codebase and
      # not something a CI step should make on its own.
      - name: Formatting (advisory)
        continue-on-error: true
        run: |
          files=$(git ls-files '*.cpp' '*.h' | grep -v '^third_party/')
          clang-format-17 --dry-run $files 2>&1 | head -80

