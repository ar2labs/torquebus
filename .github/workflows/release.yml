#
# tag v0.x.y -> build Windows x64 -> package -> GitHub Release
# (PLAN.md section 33).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Windows x64 release
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtserialbus qtserialport"
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git"
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: lukka/get-cmake@latest

      # The preset by name, so that what ships is the configuration developers
      # build and test. Passing -DCMAKE_BUILD_TYPE=Release here produced a
      # fourth configuration nobody had - and skipped the toolchain pins the
      # presets carry.
      - name: Configure and build
        run: |
          cmake --preset windows-msvc-release -DTORQUEBUS_WARNINGS_AS_ERRORS=ON
          cmake --build --preset windows-msvc-release

      - name: Test
        working-directory: build/windows-msvc-release
        run: ctest --output-on-failure --label-exclude hardware

      # --component torquebus, not a plain install: the FetchContent
      # dependencies install themselves otherwise. LICENSE and README arrive
      # through the install rules, so they cannot be forgotten here.
      - name: Package
        run: |
          cmake --install build/windows-msvc-release --prefix dist --component torquebus
          windeployqt --release --no-translations dist/TorqueBusStudio.exe

          # And once per plugin, into the same directory. windeployqt asks the
          # binary it is given what it needs, and the executable does not link
          # Qt6::SerialBus - that is the point of PEAK being a plugin. Pointed
          # only at the executable, it packaged a PEAK plugin whose Qt was not
          # there, and the plugin could not load.
          # The Kvaser plugin links no Qt at all, so windeployqt refuses it with
          # "does not seem to be a Qt executable" - the right answer, and not a
          # reason to fail the job.
          $ErrorActionPreference = "Continue"
          Get-ChildItem dist/plugins/*.dll | ForEach-Object {
            windeployqt --release --no-translations --dir dist $_.FullName
          }
          $global:LASTEXITCODE = 0

      # Before the zip, not after: a release that is missing the vendor plugins
      # should never become a download.
      - name: Check the package
        run: pwsh tools/check-package.ps1 -Path dist

      - name: Compress
        run: |
          Compress-Archive -Path dist/* -DestinationPath "TorqueBus-Studio-${{ github.ref_name }}-win64.zip"

      # The notes come from CHANGELOG.md, not from commit subjects.
      # generate_release_notes produces an accurate list and a useless one: the
      # subjects in this repository are full sentences, several describing a bug
      # found rather than a feature shipped, and somebody looking at a download
      # wants to know what the build does. This step fails the release when the
      # tag has no section, which is the right moment to notice.
      - name: Release notes from the changelog
        run: |
          pwsh -File tools/release-notes.ps1 -Version "${{ github.ref_name }}" > changelog-section.md
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $preamble = @(
            "Windows 11 x64 build. The virtual backend works with no driver installed",
            "at all; for real hardware you need the vendor's own driver:",
            "",
            "- Kvaser: Kvaser drivers + CANlib",
            "- PEAK-System: PCAN-Basic (PCANBasic.dll) + device driver",
            "",
            "Licensed under the GNU General Public License v3.0 or later.",
            "",
            "---",
            ""
          )

          Set-Content -Path release-body.md -Value $preamble -Encoding utf8
          Add-Content -Path release-body.md -Value (Get-Content changelog-section.md) -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: TorqueBus-Studio-${{ github.ref_name }}-win64.zip
          body_path: release-body.md
