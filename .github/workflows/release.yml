#
# tag v0.x.y -> build Windows x64 -> package -> GitHub Release
# (PLAN.md section 33).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Windows x64 release
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtserialbus
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: lukka/get-cmake@latest

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTORQUEBUS_BUILD_TESTS=ON
          cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --label-exclude hardware

      # --component torquebus, not a plain install: the FetchContent
      # dependencies install themselves otherwise. LICENSE and README arrive
      # through the install rules, so they cannot be forgotten here.
      - name: Package
        run: |
          cmake --install build --prefix dist --component torquebus
          windeployqt --release --no-translations dist/TorqueBusStudio.exe

      # Before the zip, not after: a release that is missing the vendor plugins
      # should never become a download.
      - name: Check the package
        run: pwsh tools/check-package.ps1 -Path dist

      - name: Compress
        run: |
          Compress-Archive -Path dist/* -DestinationPath "TorqueBus-Studio-${{ github.ref_name }}-win64.zip"

      # The notes come from CHANGELOG.md, not from commit subjects.
      # generate_release_notes produces an accurate list and a useless one: the
      # subjects in this repository are full sentences, several describing a bug
      # found rather than a feature shipped, and somebody looking at a download
      # wants to know what the build does. This step fails the release when the
      # tag has no section, which is the right moment to notice.
      - name: Release notes from the changelog
        run: |
          pwsh -File tools/release-notes.ps1 -Version "${{ github.ref_name }}" > changelog-section.md
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $preamble = @(
            "Windows 11 x64 build. The virtual backend works with no driver installed",
            "at all; for real hardware you need the vendor's own driver:",
            "",
            "- Kvaser: Kvaser drivers + CANlib",
            "- PEAK-System: PCAN-Basic (PCANBasic.dll) + device driver",
            "",
            "Licensed under the GNU General Public License v3.0 or later.",
            "",
            "---",
            ""
          )

          Set-Content -Path release-body.md -Value $preamble -Encoding utf8
          Add-Content -Path release-body.md -Value (Get-Content changelog-section.md) -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: TorqueBus-Studio-${{ github.ref_name }}-win64.zip
          body_path: release-body.md
