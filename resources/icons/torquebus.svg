<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    TorqueBus Studio mark.

    A torque arc closing around a bus line: the open end of the arc is the
    "not yet measured" part of the rotation, and the three stacked segments
    are the frames travelling the bus. Deliberately unlike any existing
    automotive tool's mark - own identity, borrowed ergonomics.
  -->
  <defs>
    <linearGradient id="tbAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#46D0E0"/>
      <stop offset="100%" stop-color="#1E8FA8"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1E1F22"/>

  <path d="M46 17.5A19 19 0 1 0 51 30"
        fill="none" stroke="url(#tbAccent)" stroke-width="5" stroke-linecap="round"/>

  <path d="M51 30l4.5-6.5L59 31z" fill="url(#tbAccent)"/>

  <rect x="20" y="24"  width="19" height="4" rx="2" fill="#E4E6EB"/>
  <rect x="20" y="31"  width="13" height="4" rx="2" fill="#E4E6EB" opacity="0.75"/>
  <rect x="20" y="38"  width="16" height="4" rx="2" fill="#E4E6EB" opacity="0.5"/>
</svg>
